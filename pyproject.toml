[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "smart-learner"
version = "1.0.0"
description = "智能学习机 - 通过AI让人更高效的学习"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "PyQt5>=5.15",
    "requests>=2.28",
]

[project.scripts]
smart-learner = "smart_learner.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=7.0",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.setuptools.packages.find]
include = ["smart_learner*"]
